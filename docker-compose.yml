services:
  app:
    build: .
    image: agfilenet:latest
    user: "${UID:-1000}:${GID:-1000}"
    ports:
      # Published on this machine only: the files contain passports, NI numbers
      # and medical details, and the app has no login.
      - "127.0.0.1:${AGFILENET_PORT:-8000}:8000"
    volumes:
      - ./data:/data:ro                 # source documents, never modified
      - ./var:/var/lib/agfilenet        # object database and page-image cache
    restart: unless-stopped
    # Hardening: nothing in the image needs to change at run time (the database
    # and page cache live on the ./var volume), or to gain privileges.
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    mem_limit: 4g
    pids_limit: 512
