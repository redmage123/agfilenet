[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "agfilenet"
version = "0.1.0"
description = "Ingest legacy FileNet/DataCap case files, derive metadata and search them"
requires-python = ">=3.10"
dynamic = ["dependencies"]

[tool.setuptools]
packages = ["agfilenet"]

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}

[tool.pytest.ini_options]
testpaths = ["tests"]
